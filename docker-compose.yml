version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WHATSAPP_SERVICE_URL=http://localhost:3001
    image: omnichannel-frontend:latest
    container_name: omnichannel_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WHATSAPP_SERVICE_URL=http://localhost:3001
